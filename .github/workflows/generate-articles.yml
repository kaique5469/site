name: 📰 Publicar Artigos

on:
  schedule:
    - cron: "0 11 * * *"      # 08:00 BRT — edição da manhã
    - cron: "0 17 * * 1-5"    # 14:00 BRT — edição da tarde (seg-sex)
  workflow_dispatch:
    inputs:
      breaking_topic:
        description: "⚡ Notícia urgente (vazio = edição normal)"
        required: false
        type: string
      num_articles:
        description: "Quantidade de artigos"
        required: false
        default: "6"
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📰 Gerar artigos
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'capitalinteligente.com.br' }}
          BREAKING_TOPIC: ${{ inputs.breaking_topic || '' }}
          NUM_ARTICLES: ${{ inputs.num_articles || '6' }}
        run: python scripts/generate_articles.py

      - name: 💾 Commit e push
        run: |
          git config user.name  "Capital Inteligente Bot"
          git config user.email "bot@capitalinteligente.com.br"
          git add articles.json artigos/ sitemap.xml
          if [ -n "${{ inputs.breaking_topic }}" ]; then
            git commit -m "⚡ Breaking: ${{ inputs.breaking_topic }}" || echo "Nada para commitar"
          else
            git commit -m "📰 Edicao de $(date +'%d/%m/%Y')" || echo "Nada para commitar"
          fi
          git push
